user www-data;
worker_processes 1;
pid /opt/travel-planner/run/nginx.pid;
error_log /opt/travel-planner/logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /opt/travel-planner/logs/nginx-access.log;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    server {
        listen 8017;
        server_name _;
        location /static/ {
            alias /opt/travel-planner/app/staticfiles/;
        }
        location / {
            proxy_pass http://127.0.0.1:18017;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
