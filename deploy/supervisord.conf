[unix_http_server]
file=/opt/travel-planner/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/opt/travel-planner/logs/supervisord.log
pidfile=/opt/travel-planner/run/supervisord.pid
childlogdir=/opt/travel-planner/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/travel-planner/run/supervisor.sock

[program:travel-web]
command=/opt/travel-planner/app/deploy/start-web.sh
directory=/opt/travel-planner/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/travel-planner/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PLAYWRIGHT_BROWSERS_PATH="/opt/travel-planner/shared/browsers"

[program:travel-nginx]
command=/usr/sbin/nginx -c /opt/travel-planner/app/deploy/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/travel-planner/logs/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
